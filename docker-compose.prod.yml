# Production stack: FalkorDB, the Canon API and the web app behind Caddy.
#   Local:  docker compose -f docker-compose.prod.yml up -d --build   (http://localhost:8080)
#   Behind Traefik: add -f docker-compose.traefik.yml (see docs/deploy.md)

services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    environment:
      BROWSER: "0"
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./server
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    volumes:
      # Workspace snapshots loaded at start: snapshots/<workspace>.graph (python -m canon.graph.snapshot export ...).
      - ./snapshots:/snapshots:ro
      - canon-data:/data
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    build: ./web
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  falkordb-data:
  canon-data:
  caddy-data:
  caddy-config:
