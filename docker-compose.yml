# Local development: Canon's own FalkorDB, on 6380 so it never meets another project's database.
services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    ports:
      - "6380:6379"   # FalkorDB (Redis protocol)
      - "3001:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  falkordb-data:
