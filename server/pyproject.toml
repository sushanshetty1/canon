[project]
name = "canon"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "sushanshetty1", email = "sushanshetty1470@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "cryptography>=50.0.2",
    "falkordb>=1.7.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
canon = "canon:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["live: calls a model"]
addopts = "-m 'not live'"
