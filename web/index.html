<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Canon. The company brain that checks itself.</title>
    <meta name="description" content="Ask how your company works. Every sentence of the answer is checked against a graph of your company: backed by a source, still current, not disputed." />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        var t = localStorage.getItem('canon-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
